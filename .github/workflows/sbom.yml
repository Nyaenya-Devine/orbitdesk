name: SBOM — Supply Chain Transparency

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install CycloneDX
        run: npm install -g @cyclonedx/cyclonedx-npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Generate SBOM — JSON + XML
        run: |
          cyclonedx-npm --output-file sbom.json --output-format json --spec-version 1.6
          cyclonedx-npm --output-file sbom.xml --output-format xml --spec-version 1.6
          ls -lh sbom.*
          cat sbom.json | head -n 100

      - name: Upload SBOM to GitHub — Dependency Graph
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: |
            sbom.json
            sbom.xml
