name: Electron Release — Auto-Update via GitHub Releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 6.6.0)'
        required: true
        default: '6.6.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish — Win/Mac/Linux
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Next Build — verify LinkedIn dock + orbit + toast modern + pause
        run: npm run build

      - name: Generate SBOM — CycloneDX for supply chain transparency
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format json || echo "SBOM fallback"
          cat sbom.json | head -n 50 || true

      - name: Build Electron — ${{ matrix.platform }}
        run: |
          npx electron-builder --${{ matrix.platform }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases — auto-update artifacts (yml, exe, dmg, AppImage)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          npx electron-builder --${{ matrix.platform }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: orbitdesk-${{ matrix.platform }}-${{ github.ref_name || inputs.version }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/*.yml
            dist/*.yaml
            sbom.json
          if-no-files-found: warn
